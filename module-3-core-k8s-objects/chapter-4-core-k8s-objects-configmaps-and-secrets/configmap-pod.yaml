apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
    - name: nginx
      image: nginx:alpine

      env:
        - name: CONTAINER_COLOR
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_COLOR

      volumeMounts:
        - name: configmap-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf

  volumes:
    - name: configmap-volume
      configMap:
        name: app-config
